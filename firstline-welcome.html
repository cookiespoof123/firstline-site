<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firstline — Set your password</title>
<meta name="description" content="Set a password to secure your Firstline account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500,600;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14121F;
    --ink-light: #1D1930;
    --cream: #F2EFFB;
    --cream-2: #E3DDF3;
    --rust: #7C5CFC;
    --rust-light: #9B87FF;
    --gold: #4C8DFF;
    --border-dark: #332C4D;

    --serif: 'Fraunces', serif;
    --sans: 'Inter', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    color: var(--cream);
    font-family: var(--sans);
    line-height: 1.6;
    padding: 2rem;
  }

  .card { max-width: 440px; width: 100%; text-align: center; }

  .logo {
    font-family: var(--serif);
    font-size: 1.5rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 2.2rem;
  }
  .logo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rust); display: inline-block; }

  .check {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(124, 92, 252, 0.16);
    border: 1px solid var(--rust);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.6rem;
    font-size: 1.6rem;
    color: var(--rust-light);
  }

  h1 { font-family: var(--serif); font-weight: 500; font-size: 1.8rem; margin: 0 0 0.7rem; }
  p { color: var(--cream-2); font-size: 0.95rem; margin: 0 0 1.6rem; }

  .field { text-align: left; margin-bottom: 1.1rem; }
  .field label { display: block; font-size: 0.82rem; color: var(--cream-2); margin-bottom: 0.4rem; }
  .field input {
    width: 100%;
    background: var(--ink-light);
    border: 1px solid var(--border-dark);
    border-radius: 6px;
    padding: 0.8rem 1rem;
    color: var(--cream);
    font-family: var(--sans);
    font-size: 0.95rem;
  }
  .field input:focus { outline: 1px solid var(--rust-light); }

  .btn {
    display: inline-flex;
    width: 100%;
    align-items: center;
    justify-content: center;
    background: var(--rust);
    color: var(--cream);
    border: none;
    border-radius: 6px;
    padding: 0.85rem 1rem;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    text-decoration: none;
    font-family: var(--sans);
    margin-top: 0.4rem;
  }
  .btn:hover { background: var(--rust-light); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .note {
    margin-top: 1.2rem;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--cream-2);
    min-height: 1.2rem;
  }

  #errorState, #successState { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Firstline <span class="dot"></span></div>

    <div id="formState">
      <div class="check">✓</div>
      <h1 id="heading">You're all set</h1>
      <p id="subtext">Set a password so you can get into your dashboard now and log back in anytime.</p>

      <form id="pwForm">
        <div class="field">
          <label>New password</label>
          <input type="password" id="password" minlength="8" required autocomplete="new-password">
        </div>
        <div class="field">
          <label>Confirm password</label>
          <input type="password" id="confirmPassword" minlength="8" required autocomplete="new-password">
        </div>
        <button class="btn" type="submit" id="submitBtn">Continue to dashboard</button>
      </form>
      <p class="note" id="note"></p>
    </div>

    <div id="errorState">
      <h1>This link isn't valid</h1>
      <p>It may have expired, or the URL got cut off. Head to the login page to request a fresh one.</p>
      <a class="btn" href="https://firstline-backend.onrender.com/login">Go to login</a>
    </div>
  </div>

<script>
(function () {
  var BACKEND_API_URL = 'https://firstline-backend.onrender.com';
  var DASHBOARD_URL = 'https://cookiespoof123.github.io/firstline-site/firstline-dashboard.html';

  var params = new URLSearchParams(window.location.search);
  var sessionToken = params.get('session');
  var isReset = params.get('reset') === '1';

  if (!sessionToken) {
    document.getElementById('formState').style.display = 'none';
    document.getElementById('errorState').style.display = 'block';
    return;
  }

  if (isReset) {
    document.getElementById('heading').textContent = 'Reset your password';
    document.getElementById('subtext').textContent = 'Choose a new password for your account.';
  }

  document.getElementById('pwForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var note = document.getElementById('note');
    var btn = document.getElementById('submitBtn');
    var password = document.getElementById('password').value;
    var confirmPassword = document.getElementById('confirmPassword').value;

    if (password.length < 8) {
      note.textContent = 'Password must be at least 8 characters.';
      return;
    }
    if (password !== confirmPassword) {
      note.textContent = "Passwords don't match.";
      return;
    }

    btn.disabled = true;
    note.textContent = 'Saving...';

    fetch(BACKEND_API_URL + '/api/auth/set-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionToken },
      body: JSON.stringify({ password: password })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) {
          note.textContent = result.data.error || 'Something went wrong — try again.';
          btn.disabled = false;
          return;
        }
        try { localStorage.setItem('fl_session_token', sessionToken); } catch (err) { /* falls through to URL param below */ }
        window.location.href = DASHBOARD_URL + '?session=' + encodeURIComponent(sessionToken);
      })
      .catch(function () {
        note.textContent = 'Something went wrong — try again in a moment.';
        btn.disabled = false;
      });
  });
})();
</script>
</body>
</html>
